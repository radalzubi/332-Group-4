name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  php:
    name: Lint and smoke-test (PHP 8.4)
    runs-on: ubuntu-latest
    env:
      # No database runs in CI: these point at a closed port, so the app's
      # "database unavailable" paths are what gets exercised.
      DB_HOST: 127.0.0.1
      DB_USER: ci
      DB_PASSWORD: ci
      DB_NAME: ci
      # Throwaway demo logins for the login smoke test below.
      DEMO_SENIOR_USERNAME: ci-senior
      DEMO_SENIOR_PASSWORD: ci-senior-pass
      DEMO_SCM_USERNAME: ci-scm
      DEMO_SCM_PASSWORD: ci-scm-pass
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: mysqli
          coverage: none

      # legacy/ holds superseded handlers kept only for reference; they are
      # not served by the app and one has a known syntax error.
      - name: Lint PHP
        run: find . -name '*.php' -not -path './.git/*' -not -path './legacy/*' -print0 | xargs -0 -n1 php -l

      - name: Check script.js syntax
        run: node --check script.js

      - name: Start the PHP built-in server
        run: |
          php -d output_buffering=0 -d display_errors=1 -S 127.0.0.1:8000 > php-server.log 2>&1 &
          for _ in $(seq 1 20); do
            curl -s -o /dev/null http://127.0.0.1:8000/index.php && exit 0
            sleep 0.5
          done
          cat php-server.log
          exit 1

      - name: Login page renders without a database
        run: |
          status=$(curl -s -o login.html -w '%{http_code}' http://127.0.0.1:8000/index.php)
          echo "HTTP $status"
          test "$status" = 200
          grep -q 'id="login-form"' login.html
          if grep -E 'Fatal error|Warning:|Uncaught' login.html; then exit 1; fi

      - name: Handlers return a JSON error without a database
        run: |
          for handler in ajax_handler_senior_managers.php ajax_handler_supply_chain_managers.php; do
            curl -s -X POST -d action=get_network_overview "http://127.0.0.1:8000/$handler" > response.json
            echo "$handler: $(cat response.json)"
            jq -e '.success == false' response.json > /dev/null
          done

      - name: Demo logins come from the environment
        run: |
          # Print where index.php?page=do_login redirects for a username/password pair.
          login() {
            curl -s -o /dev/null -w '%{redirect_url}' -X POST \
              --data-urlencode "username=$2" --data-urlencode "password=$3" \
              "http://127.0.0.1:$1/index.php?page=do_login"
          }
          expect() {
            echo "$1 -> $2"
            case "$2" in *"$3") ;; *) echo "expected a redirect ending in $3"; exit 1 ;; esac
          }
          expect "senior login" "$(login 8000 "$DEMO_SENIOR_USERNAME" "$DEMO_SENIOR_PASSWORD")" "page=erp"
          expect "scm login" "$(login 8000 "$DEMO_SCM_USERNAME" "$DEMO_SCM_PASSWORD")" "page=scm"
          expect "wrong password" "$(login 8000 "$DEMO_SENIOR_USERNAME" wrong)" "page=login&error=1"
          expect "empty credentials" "$(login 8000 "" "")" "page=login&error=1"

          # With no DEMO_* variables at all, even empty credentials must be refused.
          env -u DEMO_SENIOR_USERNAME -u DEMO_SENIOR_PASSWORD -u DEMO_SCM_USERNAME -u DEMO_SCM_PASSWORD \
            php -S 127.0.0.1:8001 > php-server-no-logins.log 2>&1 &
          for _ in $(seq 1 20); do curl -s -o /dev/null http://127.0.0.1:8001/index.php && break; sleep 0.5; done
          expect "unset accounts, empty credentials" "$(login 8001 "" "")" "page=login&error=1"

      - name: Server log
        if: always()
        run: cat php-server.log 2>/dev/null || echo "(server never started)"
